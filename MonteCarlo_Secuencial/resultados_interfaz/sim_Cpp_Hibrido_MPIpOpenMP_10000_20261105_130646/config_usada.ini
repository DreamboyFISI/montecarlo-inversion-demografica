# CONFIGURACION ILUSTRATIVA CON INCERTIDUMBRE MACRO (factor_fec ~ N(1, 0.05), factor_mort ~ N(1, 0.015)).
# Los sigmas son supuestos didacticos; se calibran en S9. Ninguno de estos supuestos completa la validacion de la fuente.
estado_datos=DEMO_NO_VALIDADO
# El CSV de poblacion no indica anio. 2025 se elige SOLO para demostrar ejecucion.
anio_base=2025
horizonte=40
escenarios=1000
semilla=12345
# Hipotesis: filas 0, 1 y 5..95 son supervivencia en intervalos de 1, 4 y 5 anios.
tipo_mortalidad=supervivencia_intervalo
# Hipotesis de unidad: nacimientos por mujer y por anio.
unidad_fecundidad=anual_por_mujer
# Parametros didacticos NO derivados de los CSV.
p_femenino=0.49
u_recien_nacido_h=0.99
u_recien_nacido_f=0.99
# Se requiere q anual explicita para 100+; no se usa el cero de la ultima fila.
q_100_h=0.35
q_100_f=0.35
# Incertidumbre macro por escenario (0 = tasas fijas). Ver config_incertidumbre.ini.
sigma_fecundidad=0.05
sigma_mortalidad=0.015
